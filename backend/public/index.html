<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5c3f">
<title data-i18n="title.home">Gëm: pay on delivery, without cash</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:,">
<script src="/vendor/qrcode.js" defer></script>
<script type="module" src="/js/home.js"></script>
</head>
<body>
<header class="top">
  <a href="/" class="logo">G<span>ë</span>m</a>
  <span class="tag" data-i18n="tagline">Delivery escrow · no one holds the money</span>
</header>
<main class="wrap" id="app">
<h1 data-i18n="home.h1">Pay on delivery. No cash. No scams.</h1>
<p class="muted" data-i18n="home.intro"></p>
<div class="roles">
  <a class="role" href="/seller"><div class="card"><strong data-i18n="home.sell">🛍️ I sell</strong><p class="muted small" data-i18n="home.sell.sub"></p></div></a>
  <a class="role" href="/rider"><div class="card"><strong data-i18n="home.deliver">🛵 I deliver</strong><p class="muted small" data-i18n="home.deliver.sub"></p></div></a>
  <div class="card"><strong data-i18n="home.buy">🙋 I buy</strong><p class="muted small" data-i18n="home.buy.sub"></p></div>
</div>
<div class="card">
  <h2 data-i18n="home.how">How it works</h2>
  <ol class="steps">
    <li data-i18n="home.step1"></li>
    <li data-i18n="home.step2"></li>
    <li data-i18n="home.step3"></li>
    <li data-i18n="home.step4"></li>
    <li data-i18n="home.step5"></li>
  </ol>
</div>
<div class="card" id="network">
  <div class="row between"><h2 data-i18n="home.net">Live network</h2><span class="small muted" id="netmode"></span></div>
  <div class="net" id="netgrid"><div data-i18n="loading">Loading…</div></div>
  <p class="small muted" data-i18n="home.net.sub"></p>
</div>
</main>
<footer data-i18n="footer">Gëm · Lightning hold invoices · Open source</footer>
</body>
</html>
